name: Refresh market data

# Rebuilds data/snapshot.json every weekday evening from Finnhub + SEC EDGAR and
# commits it back. The API key lives in repo secrets and never reaches the browser.

on:
  schedule:
    # 22:20 UTC on weekdays. That is 6:20pm ET in summer and 5:20pm ET in winter,
    # so it clears the 4pm close year-round without needing a DST adjustment, and
    # it also picks up filings EDGAR accepted during the day (cutoff 5:30pm ET).
    # The date is still the same weekday in ET at 22:20 UTC, so 1-5 is correct.
    - cron: "20 22 * * 1-5"
  workflow_dispatch:           # lets you run it on demand from the Actions tab
    inputs:
      limit:
        description: "Only process the first N companies (blank = all)"
        required: false
        default: ""
      skip_filings:
        description: "Skip downloading 10-Ks (1 = skip)"
        required: false
        default: ""

# Read-only by default; only the refresh job may write, and only its last step
# holds the token that can (see "Commit if anything changed").
permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu on its own
    # schedule (26 from October 2026); the job is plain Node either way.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      # v5 of both run on Node 24; v4 ran on Node 20, which GitHub retired.
      # persist-credentials: false keeps the write token out of .git/config,
      # so the steps that download and parse outside data never hold it.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build snapshot
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          LIMIT: ${{ github.event.inputs.limit }}
          SKIP_FILINGS: ${{ github.event.inputs.skip_filings }}
        run: node scripts/refresh.mjs

      # The gate. Compares what was just built against what is already live and
      # refuses to go further if the data is worse than yesterday's. A failure
      # here means nothing is committed, so the previous snapshot stays up.
      - name: Audit before publishing
        run: node scripts/audit.mjs

      # Moves the score's weekly picks forward by tonight's prices (see the
      # header of scripts/track.mjs). After the audit, so only data that passed
      # it is counted; a failure here never holds the prices back.
      - name: Follow the score's picks
        continue-on-error: true
        run: node scripts/track.mjs

      # Only a check that the new data still builds. The pages themselves are
      # built by Vercel on every deploy (vercel.json buildCommand) and are never
      # committed: see docs/LESSONS.md.
      - name: Check the company pages still build
        env:
          SITE_ORIGIN: https://stockornot.com
        run: node scripts/build-pages.mjs

      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: data/snapshot.json data/audit.json data/filings data/detail data/fundamentals data/track.json
        run: |
          git config user.name  "stockornot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other commits can land on the branch while this job runs. Move onto
          # the tip with a clean checkout of it, so nothing anyone else changed
          # is undone, then lay only the files this job generates over it and
          # commit those. No merge is attempted, and on its own files the run
          # that just did the work wins. Files the job deleted (a company that
          # left the index) stay deleted.
          # The token is used here and nowhere earlier in the job.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "$remote" "${GITHUB_REF_NAME}"
          paths=""
          for p in $BUILT; do [ -e "$p" ] && paths="$paths $p"; done
          keep="$RUNNER_TEMP/built.tar"
          tar -cf "$keep" $paths
          git reset -q --hard FETCH_HEAD
          rm -rf $paths
          tar -xf "$keep"
          git add -A $paths

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%d')"
            git push "$remote" "HEAD:${GITHUB_REF_NAME}"
          fi

  # A week's warning before anything in a signed-in cart reports. A job of its
  # own, after the publish, so a mail outage can never hold the data back. It
  # holds the database and mail keys, so it gets no write access to the
  # repository, and the refresh job never sees those keys. It skips itself
  # cleanly until SUPABASE_SERVICE_ROLE_KEY and RESEND_API_KEY exist, and
  # limited test runs never email anyone.
  alerts:
    needs: refresh
    if: ${{ !github.event.inputs.limit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # the branch tip, so the snapshot the refresh job just committed
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Email earnings alerts
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SITE_ORIGIN: https://stockornot.com
        run: node scripts/earnings-alerts.mjs
