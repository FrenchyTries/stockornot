name: Build company pages

# Regenerates the static per-company pages from whatever data is already
# committed. Takes seconds, hits no APIs — so template changes can ship without
# waiting on a full data refresh. The data refresh also runs this itself.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-pages.mjs"
      - "lib/analysis.mjs"
      - "data/snapshot.json"

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate pages
        env:
          SITE_ORIGIN: https://stockornot.com
        run: node scripts/build-pages.mjs

      - name: Commit if anything changed
        env:
          BUILT: stock sitemap.xml robots.txt
        run: |
          git config user.name  "stockornot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other commits can land on the branch while this job runs. Move onto
          # the tip with a clean checkout of it, so nothing anyone else changed
          # is undone, then lay only the files this job generates over it and
          # commit those. No merge is attempted, and on its own files the run
          # that just did the work wins. Files the job deleted (a company that
          # left the index) stay deleted.
          git fetch origin "${GITHUB_REF_NAME}"
          paths=""
          for p in $BUILT; do [ -e "$p" ] && paths="$paths $p"; done
          keep="$RUNNER_TEMP/built.tar"
          tar -cf "$keep" $paths
          git reset -q --hard FETCH_HEAD
          rm -rf $paths
          tar -xf "$keep"
          git add -A $paths

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild company pages $(date -u +'%Y-%m-%d')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
